<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uide Fast Food — Онлайн Меню</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --primary: #ff9800;
            --primary-glow: rgba(255, 152, 0, 0.3);
            --accent: #ff5722;
            --text: #ffffff;
            --text-sub: #a0a0ab;
            --green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding-bottom: 100px;
        }

        /* HEADER & BRANDING */
        header {
            background: linear-gradient(180deg, #1f1f26 0%, #121215 100%);
            padding: 20px 16px 15px;
            border-bottom: 2px solid rgba(255, 152, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .brand-name {
            font-family: 'Rubik', sans-serif;
            font-size: 20px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #ffa726, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 10px;
            color: var(--text-sub);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 152, 0, 0.4);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-btn:active {
            transform: scale(0.95);
        }

        .info-card {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-card a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* SEARCH & CATEGORIES */
        .search-container {
            padding: 14px 16px 6px;
        }

        .search-bar {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .cats-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 16px;
            scrollbar-width: none;
        }

        .cats-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-chip.active {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* MENU ITEMS */
        .menu-grid {
            padding: 10px 16px;
        }

        .section-header {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin: 16px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            background: #25252b;
            flex-shrink: 0;
        }

        .card-details {
            flex-grow: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .card-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-add {
            background: rgba(255, 152, 0, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:active {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        /* CART FLOATING BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, #1f1f26, #141418);
            border: 1px solid rgba(255, 152, 0, 0.4);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 15px var(--primary-glow);
            z-index: 1000;
        }

        .cart-bar-info {
            font-size: 13px;
            font-weight: 600;
        }

        .btn-open-cart {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        /* MODAL WINDOWS */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-body {
            background: #18181c;
            width: 100%;
            max-height: 80vh;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            overflow-y: auto;
            border-top: 2px solid var(--primary);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 22px;
            cursor: pointer;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #25252b;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-whatsapp {
            width: 100%;
            background: var(--green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            margin-top: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        /* DONER CHOICE OPTIONS */
        .option-btn {
            width: 100%;
            background: #222228;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(255, 152, 0, 0.1);
        }
    </style>
</head>

            <button class="btn-whatsapp" id="btnWhatsApp" onclick="sendWhatsApp()">
                <span>Отправить в WhatsApp</span>
            </button>
        </div>
    </div>

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'kz' : 'ru';
            document.getElementById('langBtn').innerText = currentLang === 'ru' ? 'KZ / RU' : 'RU / KZ';
            document.getElementById('searchInput').placeholder = i18n[currentLang].search;
            document.getElementById('btnCartOpen').innerText = i18n[currentLang].order;
            document.getElementById('cartTitle').innerText = i18n[currentLang].cartTitle;
            document.getElementById('btnWhatsApp').innerText = i18n[currentLang].whatsapp;
            
            renderCats();
            renderMenu();
            updateCart();
        }

        function renderCats() {

            const container = document.getElementById('catsContainer');
            container.innerHTML = cats.map(c => `
                <button class="cat-chip ${activeCategory === c ? 'active' : ''}" onclick="selectCat('${c}')">
                    ${i18n[currentLang].cats[c]}
                </button>
            `).join('');
        }

        function selectCat(c) {
            activeCategory = c;
            renderCats();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = menuData.filter(item => {
                let matchCat = activeCategory === 'all' || item.cat === activeCategory;
                let matchSearch = item.name[currentLang].toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-sub); margin-top:40px;">Ничего не найдено</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                let priceText = item.isVariable 
                    ? `${item.prices.half} - ${item.prices.full} тг` 
                    : `${item.price} тг`;

                let action = item.isVariable 
                    ? `openOptions('${item.id}')` 
                    : `addItem('${item.id}', '${item.name[currentLang]}', ${item.price})`;

                let btnLabel = item.isVariable ? i18n[currentLang].choose : i18n[currentLang].add;

                return `
                    <div class="menu-card">
                        <img src="${item.img}" class="card-img" alt="${item.name[currentLang]}">
                        <div class="card-details">
                            <div class="card-title">${item.name[currentLang]}</div>
                            <div class="card-price">${priceText}</div>
                        </div>
                        <button class="btn-add" onclick="${action}">${btnLabel}</button>
                    </div>
                `;
            }).join('');
        }

        function openOptions(id) {
            const item = menuData.find(i => i.id === id);
            selectedDoner = item;
            const container = document.getElementById('optionList');
            
            container.innerHTML = `
                <button class="option-btn" onclick="selectOption('half')">
                    <span>${i18n[currentLang].half}</span>
                    <span>${item.prices.half} тг</span>
                </button>
                <button class="option-btn" onclick="selectOption('full')">
                    <span>${i18n[currentLang].full}</span>
                    <span>${item.prices.full} тг</span>
                </button>
            `;
            document.getElementById('optionModal').style.display = 'flex';
        }

        function selectOption(size) {
            let title = `${selectedDoner.name[currentLang]} (${size === 'half' ? i18n[currentLang].half : i18n[currentLang].full})`;
            let price = selectedDoner.prices[size];
            let itemKey = `${selectedDoner.id}_${size}`;
            
            addItem(itemKey, title, price);
            closeOptions();
        }

        function closeOptions() {
            document.getElementById('optionModal').style.display = 'none';
        }

        function filterMenu() { renderMenu(); }

        function addItem(key, name, price) {
            if (cart[key]) {
                cart[key].qty++;
            } else {
                cart[key] = { name, price, qty: 1 };
            }
            updateCart();
        }

        function changeQty(key, delta) {
            if (cart[key]) {
                cart[key].qty += delta;
                if (cart[key].qty <= 0) delete cart[key];
            }
            updateCart();
            renderCartModal();
        }

        function updateCart() {
            let totalQty = Object.values(cart).reduce((a, b) => a + b.qty, 0);
            let bar = document.getElementById('cartBar');
            if (totalQty > 0) {
                bar.style.display = 'flex';
                document.getElementById('cartBarText').innerText = `${i18n[currentLang].cartBar} ${totalQty} шт.`;
            } else {
                bar.style.display = 'none';
                closeCart();
            }
        }

        function openCart() {
            renderCartModal();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCartModal() {
            const container = document.getElementById('cartItems');
            let sum = 0;
            container.innerHTML = '';

            for (let k in cart) {
                let item = cart[k];
                let itemSum = item.price * item.qty;
                sum += itemSum;
                container.innerHTML += `
                    <div class="cart-row">
                        <div>
                            <div style="font-weight:600; font-size:14px;">${item.name}</div>
                            <div style="font-size:12px; color:var(--text-sub);">${item.price} тг × ${item.qty} = ${itemSum} тг</div>
                        </div>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="changeQty('${k}', -1)">-</button>
                            <span style="font-weight:bold;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${k}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('cartTotal').innerText = `${i18n[currentLang].total} ${sum} тг`;
        }

        function sendWhatsApp() {
            let msg = currentLang === 'ru' ? "Здравствуйте! Хочу сделать заказ:\n\n" : "Сәлеметсіз бе! Тапсырыс бергім келеді:\n\n";
            let sum = 0;
            for (let k in cart) {
                let item = cart[k];
                let itemSum = item.price * item.qty;
                sum += itemSum;
                msg += `• ${item.name} x${item.qty} — ${itemSum} тг\n`;
            }
            msg += `\n*${i18n[currentLang].total} ${sum} тг*`;
            
            window.open(`https://wa.me/77002302331?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = () => {
            renderCats();
            renderMenu();
        };
    </script>
</body>
</html>
